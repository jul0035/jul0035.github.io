<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            background-color: #ffe5ec; /* Cute pastel pink background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #4c1130;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Updated to a generic image filename -->
        <img src="photo.jpg" id="landing-photo" alt="Our Photo">
        
        <h1>BONNE FÊTE MARIE✨</h1>
        
        <!-- Updated to support M4A audio -->
        <audio controls>
            <source src="music.m4a" type="audio/mp4">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        // Automatic extension fallback helper
        // If photo.jpg fails to load, it will automatically try photo.png or photo.jpeg
        const img = document.getElementById('landing-photo');
        const extensions = ['png', 'jpeg', 'PNG', 'JPG', 'JPEG'];
        let currentIndex = 0;

        img.onerror = function() {
            if (currentIndex < extensions.length) {
                const srcWithoutExt = img.src.substring(0, img.src.lastIndexOf('.'));
                img.src = srcWithoutExt + '.' + extensions[currentIndex];
                currentIndex++;
            }
        };
    </script>

</body>
</html>
