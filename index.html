<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            background-color: #ffe5ec; /* Cute pastel pink background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #4c1130;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 15px;
            outline: none;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <video controls playsinline poster="photo.jpg">
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h1>Press play! ✨</h1>
    </div>

</body>
</html>
