<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            background-color: #ffe5ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #4c1130;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #ff4d6d;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #c9184a;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Display your photo -->
        <img src="photo.jpg" id="landing-photo" alt="Our Photo">
        
        <h1>I made something for you! ✨</h1>
        
        <!-- Replace YOUR_GOOGLE_DRIVE_LINK_HERE with your copied link -->
        <a href="https://drive.google.com/file/d/1fciUI6PxDBDBar8LauUCua6cZEeN_SB-/view?usp=drive_link" target="_blank" class="btn">
            ▶ Watch Video
        </a>
    </div>

    <script>
        // Automatic extension fallback helper for photo
        const img = document.getElementById('landing-photo');
        const extensions = ['png', 'jpeg', 'PNG', 'JPG', 'JPEG'];
        let currentIndex = 0;

        img.onerror = function() {
            if (currentIndex < extensions.length) {
                const srcWithoutExt = img.src.substring(0, img.src.lastIndexOf('.'));
                img.src = srcWithoutExt + '.' + extensions[currentIndex];
                currentIndex++;
            }
        };
    </script>

</body>
</html>
